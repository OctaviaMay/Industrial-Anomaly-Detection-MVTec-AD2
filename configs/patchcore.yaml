data:
  name : vial
  root : D:/Downloads/vial/vial   #  local MVTec AD 2 Vial download folder
  normal_dir : train/good
  normal_test_dir : test_public/good
  abnormal_dir : test_public/bad
  mask_dir : test_public/ground_truth/bad
  batch_size : 16
  num_workers : 0   # 0 avoids DataLoader memory crashes on Windows

model:
  backbone: wide_resnet50_2
  layers: [layer2, layer3]
  coreset_sampling_ratio: 0.01

output_dir: results/

export:
  ckpt: results/Patchcore/vial/latest/weights/lightning/model.ckpt
  root: results/export
  input_size: [256,256]